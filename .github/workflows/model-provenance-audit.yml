# Audit RED #38131843709: 5 tests, 3 FAIL; flags/defaults/custody hashes absent.
# First isolated GREEN #38132075963: 69 tests PASS before README count gate.
# Full-suite README census RED #38132236462: old experiments 3/32, measured 4/37.
# Latest scoped GREEN #38132392648 at f5b1d7a85a28903b31ea1480fbd520497ec1ebc9:
# 5 audit + 26 runner/grid + 27 historical/scope + 11 frozen E0 = 69 PASS.
# Preset data and flight calibration unchanged; E0 mileage caveat preserved.
# RED #38131843709: 5 tests, 3 FAIL (flag values, defaults, enabled module hashes).
# Dedicated GREEN #38132075963 at b6e49f2093d020ef6131fa6ff8e17e9f61087d38:
# 5 model audit + 26 runner/grid + 27 history/scope + 11 frozen E0 = 69 PASS.
# Frozen E0 mileage definition remains historically incomparable.
# No physical flight calibration or production/frozen result changes.
name: Experimental model provenance audit RED
on:
  push:
    branches: [audit/model-provenance-and-paired-plan-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact pinned project dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: Audit provenance RED and paired experiment plan
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v experiments.test_model_provenance_gate
      - name: Existing runner and grid regression
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v experiments.test_runner experiments.test_grid
      - name: Immutable B5g and exact audit six-file scope
        run: |
          .\\.venv310\\Scripts\\python.exe -m unittest -v scripts.p2_4a_state_contract_test
      - name: Frozen E0 controls all experimental gates off
        env:
          SWARM_BALANCE_B5G_SERIALIZED_RECONCILIATION: "0"
          SWARM_BALANCE_B5F_QUEUE_RECONCILIATION: "0"
          SWARM_BALANCE_B5C_MIXED_CHAIN_RELEASE: "0"
          SWARM_BALANCE_B5B_EXTERNAL_HANDOFF: "0"
          SWARM_BALANCE_B5A_CARGO_CUSTODY_GATE: "0"
          SWARM_BALANCE_INFLIGHT_WIND_REQUOTE: "0"
          SWARM_BALANCE_HELD_ROUTE_REQUOTE: "0"
          SWARM_BALANCE_AUTO_PLANNED_STATION: "0"
          SWARM_BALANCE_CHARGE_TARGET_IDENTITY: "0"
          SWARM_BALANCE_PLANNED_STATION_ROUTE: "0"
          SWARM_BALANCE_STATION_ENERGY_GATE: "0"
        run: |
          .\.venv310\Scripts\python.exe -m unittest discover -s frontend -p test_wind_injection.py -v
