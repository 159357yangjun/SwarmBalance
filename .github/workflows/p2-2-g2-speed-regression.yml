name: P2.2 G2 speed-fixture regression

on:
  push:
    branches: [p2-2-flight-energy-gate-v1]

permissions:
  contents: read

jobs:
  g2-speed:
    name: G2 unchanged teeth and P2.2 safety contract
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout branch (no merge)
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact project dependencies
        run: |
          python -m venv .venv310
          .\\.venv310\\Scripts\\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\\.venv310\\Scripts\\python.exe -m pip install -r requirements.txt
      - name: Validate G2 speed/optimizer, mutation teeth and safety RED/GREEN contract
        run: |
          .\\.venv310\\Scripts\\python.exe -m unittest -v console.test_speed_fallback_gate console.test_g2teeth_calibration scripts.test_p2_2_flight_energy_gate
