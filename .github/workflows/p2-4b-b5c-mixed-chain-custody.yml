name: P2.4b-B5c mixed-chain custody RED
on:
  push:
    branches: [p2-4b-b5c-mixed-chain-custody-red-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b5c-custody:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned project dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: B5c real pickup mixed-chain RED and GREEN
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b5c_mixed_chain_custody_red
      - name: Strict inherited B5b B5a B4e through P2.4a
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b5b_external_custody_red scripts.test_p2_4b_b5a_cargo_custody_red scripts.test_p2_4b_b4e_end_to_end_conservation scripts.test_p2_4b_b4d_inflight_wind_energy scripts.test_p2_4b_b4c_held_route_requote scripts.test_p2_4b_b4b_auto_target_closure scripts.test_p2_4b_b4_auto_planned_nest scripts.test_p2_4b_b3c_target_station scripts.test_p2_4b_b3b_planned_charge_route scripts.test_p2_4b_b3_planned_station_quote scripts.test_p2_4b_b2_station_energy_gate scripts.test_p2_4b_b1_energy_quote scripts.test_p2_2_flight_energy_gate console.test_c4_cargo_truth_scan_gate scripts.p2_4a_state_contract_test
      - name: Frozen E0 equivalence all experimental gates OFF
        env:
          SWARM_BALANCE_B5C_MIXED_CHAIN_RELEASE: "0"
          SWARM_BALANCE_B5B_EXTERNAL_HANDOFF: "0"
          SWARM_BALANCE_B5A_CARGO_CUSTODY_GATE: "0"
          SWARM_BALANCE_INFLIGHT_WIND_REQUOTE: "0"
          SWARM_BALANCE_HELD_ROUTE_REQUOTE: "0"
          SWARM_BALANCE_AUTO_PLANNED_STATION: "0"
          SWARM_BALANCE_CHARGE_TARGET_IDENTITY: "0"
          SWARM_BALANCE_PLANNED_STATION_ROUTE: "0"
          SWARM_BALANCE_STATION_ENERGY_GATE: "0"
        run: |
          .\.venv310\Scripts\python.exe -m unittest discover -s frontend -p test_wind_injection.py -v
