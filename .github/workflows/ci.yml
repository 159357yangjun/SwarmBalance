name: SwarmBalance verification

on:
  pull_request:
    branches: [master, ci-validation]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # test_gate_ascii_diagnostics.py retrieves historical _citations.py revisions.
          fetch-depth: 0

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # Match the Windows .venv310 interpreter used by _readme_counts.
      - name: Create project interpreter and pin pip
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2"

      - name: Install NumPy before other dependencies
        run: .\.venv310\Scripts\python.exe -m pip install numpy==1.26.4

      - name: Install complete project requirements
        run: .\.venv310\Scripts\python.exe -m pip install -r requirements.txt

      - name: Verify interpreter and import dependencies
        run: |
          .\.venv310\Scripts\python.exe -c "import sys, numpy, osmnx, shapely, geopandas, fiona, pyproj, networkx, pandas, yaml, ortools, fastapi; assert sys.version_info[:2] == (3, 10); assert numpy.__version__ == '1.26.4'; print('[CI_DEPS] Python', sys.version.split()[0], 'NumPy', numpy.__version__)"

      - name: Compile Python sources
        run: .\.venv310\Scripts\python.exe -m compileall -q backend_si console experiments frontend scripts

      - name: Validate skip-guard negative controls
        run: .\.venv310\Scripts\python.exe scripts/ci_unittest.py selftest

      - name: Verify README test discovery census
        id: readme_census
        run: .\.venv310\Scripts\python.exe console/_readme_counts.py --verify

      - name: Diagnose README discovery mismatch
        if: ${{ failure() && steps.readme_census.outcome == 'failure' }}
        run: .\.venv310\Scripts\python.exe scripts/ci_unittest.py diagnose

      - name: Verify documentation citation anchors
        run: .\.venv310\Scripts\python.exe console/_citations.py --verify --portable-rewrite

      - name: Verify rewrite-map tests (complete Git history)
        env:
          SWARM_REWRITE_TEST_MODE: portable
        run: .\.venv310\Scripts\python.exe -m unittest -v console.test_rewrite_map

      - name: Recheck three full-suite regression failures
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v console.test_dead_charging_fields.DeadChargingFieldTests.test_classifier_is_not_vacuous console.test_compare_gate.CitationIntegrityTests.test_coverage_is_printed_not_just_asserted console.test_frozen_artifact_source_pins.FrozenArtifactSourcePin.test_C_declaration_requires_the_named_artifact

      - name: Quick invariant checks (P2, P3, G2 calibration)
        run: .\.venv310\Scripts\python.exe scripts/ci_unittest.py quick


  portable-rewrite-shallow:
    name: Portable rewrite archive (shallow clone)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exactly one commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Assert shallow checkout
        run: test "$(git rev-parse --is-shallow-repository)" = "true"
      - name: Verify archive with explicit partial-history scope
        run: python console/_citations.py --rewrite-report --verify --portable
      - name: Verify rewrite-map tests (shallow Git history)
        env:
          SWARM_REWRITE_TEST_MODE: portable
        run: python -m unittest -v console.test_rewrite_map

  # The latest *PR head commit*, not dispatch inputs or the synthetic PR merge
  # commit, is the trigger. A normal PR update must NOT launch this slow matrix.
  full-suite-request:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Checkout PR history for HEAD commit message
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check exact full-suite commit marker
        id: detect
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          if git show -s --format=%B "$PR_HEAD_SHA" | grep -Fq '[full-suite]'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "[CI_FULL_TRIGGER] head_sha=$PR_HEAD_SHA marker=true"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "[CI_FULL_TRIGGER] head_sha=$PR_HEAD_SHA marker=false"
          fi

  full-suite:
    name: Full suite / ${{ matrix.group }}
    needs: full-suite-request
    if: ${{ needs.full-suite-request.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [console, experiments, frontend, root]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SWARM_REWRITE_TEST_MODE: portable
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout full Git history for history-based tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create project interpreter and pin pip
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2"
      - name: Install NumPy before other dependencies
        run: .\.venv310\Scripts\python.exe -m pip install numpy==1.26.4
      - name: Install complete project requirements
        run: .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: Execute full unittest group with strict skip policy
        run: .\.venv310\Scripts\python.exe scripts/ci_unittest.py --group ${{ matrix.group }}

  p1-energy-ledger-audit:
    name: P1 energy and loaded-mileage hard assertions (model unchanged)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create project interpreter
        run: |
          python -m venv .venv310
          .\\.venv310\\Scripts\\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
      - name: Install project requirements
        run: .\\.venv310\\Scripts\\python.exe -m pip install -r requirements.txt
      - name: Run production-path mileage and Wh contract probes
        run: .\\.venv310\\Scripts\\python.exe -m unittest -v scripts.test_p1_load_energy_ledger_audit

  p1-fixed-seed-comparison:
    name: P1 fixed-seed real-simulation comparison
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout original and candidate Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create interpreter and install exact dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: Replay before/after with identical seeds 40901 and 40902
        env:
          P1_BASE_SHA: ${{ github.base_ref == 'ci-validation' && github.event.pull_request.base.sha || 'a7283a5f4ac2671b46f5db2aaa38079fcaa34ae5' }}
          P1_B_MODE: ${{ github.head_ref == 'p1-b-onboard-energy-experiment' && 'onboard' || 'assigned' }}
        run: |
          git worktree add --detach .p1_before $env:P1_BASE_SHA
          $oldJson = Join-Path $env:RUNNER_TEMP "p1_before.json"
          $newJson = Join-Path $env:RUNNER_TEMP "p1_after.json"
          .\.venv310\Scripts\python.exe scripts/p1_seeded_metrics.py --root .p1_before --seeds 40901,40902 --steps 900 --label before --output $oldJson
          $env:SWARM_BALANCE_ENERGY_ACCOUNTING = $env:P1_B_MODE
          .\.venv310\Scripts\python.exe scripts/p1_seeded_metrics.py --root . --seeds 40901,40902 --steps 900 --label after --output $newJson
          .\.venv310\Scripts\python.exe scripts/p1_seeded_metrics.py --compare $oldJson $newJson
