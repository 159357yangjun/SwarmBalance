name: P2.4b-B4c wind-shift whole-route budget RED

on:
  push:
    branches: [p2-4b-b4c-midflight-wind-guard-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b4c-wind:
    name: Real dynamic wind, remaining route and P2.2 movement gate
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: True RED or GREEN real dynamic wind route-budget tests
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b4c_wind_route_budget
      - name: Full inherited B4b B4 B3c B3b B3a B2 B1 P2.2 C4 and 17 strict Git gates
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b4b_auto_station_identity scripts.test_p2_4b_b4_auto_planned_nest scripts.test_p2_4b_b3c_target_station scripts.test_p2_4b_b3b_planned_charge_route scripts.test_p2_4b_b3_planned_station_quote scripts.test_p2_4b_b2_station_energy_gate scripts.test_p2_4b_b1_energy_quote scripts.test_p2_2_flight_energy_gate console.test_c4_cargo_truth_scan_gate scripts.p2_4a_state_contract_test
      - name: Frozen E0 replay with ALL experiments OFF
        env:
          SWARM_BALANCE_AUTO_WIND_BUDGET_GATE: "0"
          SWARM_BALANCE_AUTO_PLANNED_STATION: "0"
          SWARM_BALANCE_CHARGE_TARGET_IDENTITY: "0"
          SWARM_BALANCE_STATION_ENERGY_GATE: "0"
          SWARM_BALANCE_PLANNED_STATION_ROUTE: "0"
        run: |
          .\.venv310\Scripts\python.exe -m unittest discover -s frontend -p test_wind_injection.py -v
