name: P2.4b-B2 real station energy reachability (RED-first)

on:
  push:
    branches: [p2-4b-b2-station-reachability-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2-red:
    name: Real P2.2 drone/station behavior with B1 quote
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout full immutable test HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: True RED or GREEN test of real station selection
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b2_station_energy_gate
