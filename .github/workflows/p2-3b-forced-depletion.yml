name: P2.3b forced depletion paired comparison

on:
  pull_request:
    branches: [ci-validation]

permissions:
  contents: read

concurrency:
  group: p23b-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.head_ref == 'p2-3b-forced-depletion-v1' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      P23B_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Parse experimental source and check out immutable simulator versions
        run: |
          python -m py_compile scripts/p2_3b_forced_depletion.py
          git worktree add --detach "$env:RUNNER_TEMP/p23b-old" 806d07653af52b83202ba232cb1f3e88dd9b7901
          git worktree add --detach "$env:RUNNER_TEMP/p23b-new" 5bcc6cb9661dc250c11c578acbacc32c8b0d6f4f
      - name: Install the unchanged Python simulator dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: SMOKE – force a matched battery-zero fault and prove old unpaid/new blocked
        run: |
          .\.venv310\Scripts\python.exe scripts/p2_3b_forced_depletion.py shard --old-root "$env:RUNNER_TEMP/p23b-old" --new-root "$env:RUNNER_TEMP/p23b-new" --evidence-root "." --outdir "$env:RUNNER_TEMP/p23b_smoke" --profile "normal" --shard 0 --seed-only 51001 --source-sha "$env:P23B_SHA"
      - name: Preserve every original order tape, fault witness and per-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23b-smoke
          path: ${{ runner.temp }}/p23b_smoke/
          retention-days: 30
          if-no-files-found: warn

  paired:
    if: ${{ github.head_ref == 'p2-3b-forced-depletion-v1' }}
    needs: [smoke]
    name: forced-depletion paired / ${{ matrix.profile }} / shard ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, elevated, high]
        shard: [0, 1]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      P23B_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Parse experimental source and check out immutable simulator versions
        run: |
          python -m py_compile scripts/p2_3b_forced_depletion.py
          git worktree add --detach "$env:RUNNER_TEMP/p23b-old" 806d07653af52b83202ba232cb1f3e88dd9b7901
          git worktree add --detach "$env:RUNNER_TEMP/p23b-new" 5bcc6cb9661dc250c11c578acbacc32c8b0d6f4f
      - name: Install the unchanged Python simulator dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: Replay five paired low-energy-injected real simulator episodes
        run: |
          .\.venv310\Scripts\python.exe scripts/p2_3b_forced_depletion.py shard --old-root "$env:RUNNER_TEMP/p23b-old" --new-root "$env:RUNNER_TEMP/p23b-new" --evidence-root "." --outdir "$env:RUNNER_TEMP/p23b_grid" --profile "${{ matrix.profile }}" --shard ${{ matrix.shard }}  --source-sha "$env:P23B_SHA"
      - name: Preserve every original order tape, fault witness and per-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23b-shard-${{ matrix.profile }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/p23b_grid/
          retention-days: 30
          if-no-files-found: warn

  report:
    if: ${{ github.head_ref == 'p2-3b-forced-depletion-v1' }}
    needs: [smoke, paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P23B_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: p23b-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/p23b_grid/
      - name: Hard fail unless 30 pairs injected identically, 60 episodes complete and both safety outcomes triggered
        run: |
          python scripts/p2_3b_forced_depletion.py aggregate --outdir "${{ runner.temp }}/p23b_grid" --source-sha "$P23B_SHA"
      - name: Publish per-seed CSV, summary JSON, full tape evidence and report
        uses: actions/upload-artifact@v4
        with:
          name: p23b-forced-depletion-30pair-report
          path: ${{ runner.temp }}/p23b_grid/
          retention-days: 30
          if-no-files-found: error
