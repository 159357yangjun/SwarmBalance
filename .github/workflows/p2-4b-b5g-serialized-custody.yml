# B5g RED: https://github.com/159357yangjun/SwarmBalance/actions/runs/38123881386
# Actual 66 tests: 2 FAIL + 1 ERROR; racing requeue / stale Env / SQLite lock.
# Dedicated GREEN: https://github.com/159357yangjun/SwarmBalance/actions/runs/38124008924
# HEAD c1a1d1f10135b6ea67f3c971e33ddf3bc277b263: 66+206+11=283 PASS.
# Frozen E0 loaded mileage definition remains historically incomparable.
# No full Environment persistence or authenticated physical handoff claim.
name: P2.4b-B5g serialized custody RED
on:
  push:
    branches: [p2-4b-b5g-serialized-custody-reconcile-red-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b5g-concurrent-queue:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned project requirements
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: B5g concurrency and SQLite failure RED GREEN
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b5g_serialized_queue_red
      - name: Inherited B5f to B5a and strict P2 scope
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b5f_queue_reconcile_red scripts.test_p2_4b_b5e_transactional_custody_red scripts.test_p2_4b_b5d_custody_journal_red scripts.test_p2_4b_b5c_mixed_chain_custody_red scripts.test_p2_4b_b5b_external_custody_red scripts.test_p2_4b_b5a_cargo_custody_red scripts.p2_4a_state_contract_test
      - name: Frozen E0 all experimental gates off
        env:
          SWARM_BALANCE_B5G_SERIALIZED_RECONCILIATION: "0"
          SWARM_BALANCE_B5F_QUEUE_RECONCILIATION: "0"
          SWARM_BALANCE_B5C_MIXED_CHAIN_RELEASE: "0"
          SWARM_BALANCE_B5B_EXTERNAL_HANDOFF: "0"
          SWARM_BALANCE_B5A_CARGO_CUSTODY_GATE: "0"
          SWARM_BALANCE_INFLIGHT_WIND_REQUOTE: "0"
          SWARM_BALANCE_HELD_ROUTE_REQUOTE: "0"
          SWARM_BALANCE_AUTO_PLANNED_STATION: "0"
          SWARM_BALANCE_CHARGE_TARGET_IDENTITY: "0"
          SWARM_BALANCE_PLANNED_STATION_ROUTE: "0"
          SWARM_BALANCE_STATION_ENERGY_GATE: "0"
        run: |
          .\.venv310\Scripts\python.exe -m unittest discover -s frontend -p test_wind_injection.py -v
