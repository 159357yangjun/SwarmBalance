name: P2.1 read-only battery feasibility audit

on:
  pull_request:
    branches: [ci-validation]

permissions:
  contents: read

jobs:
  low-energy-audit:
    if: ${{ github.head_ref == 'p2-1-low-energy-audit-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install existing simulator dependencies
        run: |
          python -m pip install 'pip==23.3.2' 'numpy==1.26.4'
          python -m pip install -r requirements.txt
      - name: Characterize low energy without changing any production behavior
        run: python -m unittest -v scripts.test_p2_1_battery_feasibility_audit
