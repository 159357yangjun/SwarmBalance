# True R1 RED #38140710083: 18 tests, 4 ERROR (missing effective billing provenance).
# Intermediate #38140848995: 18 tests PASS; moving historical PR36 scope caught R1 new files.
# Latest dedicated GREEN #38140967990 at 59e0ec4222482dbcb3f89719708ee7b24893e249:
# 18 real R1 and inherited P1 + 64 B1/PR36/scope + 11 frozen E0 = 93 PASS.
# All model coefficients and frozen datasets unchanged; historical E0 mileage caveat retained.
name: Research R1 energy-unit provenance RED
on:
  push:
    branches: [research/r1-energy-units-and-accounting-provenance-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1-energy:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned project requirements
        run: |
          python -m venv .venv310
          .\\.venv310\\Scripts\\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\\.venv310\\Scripts\\python.exe -m pip install -r requirements.txt
      - name: R1 real Drone Wh m km and effective policy provenance RED
        run: |
          .\\.venv310\\Scripts\\python.exe -m unittest -v scripts.test_research_r1_energy_units_red
      - name: Inherited B1 energy, manifest and immutable R1 scope
        run: |
          .\\.venv310\\Scripts\\python.exe -m unittest -v scripts.test_p2_4b_b1_energy_quote experiments.test_model_provenance_gate scripts.p2_4a_state_contract_test
      - name: Frozen E0 all experimental flags off
        env:
          SWARM_BALANCE_B5G_SERIALIZED_RECONCILIATION: "0"
          SWARM_BALANCE_B5F_QUEUE_RECONCILIATION: "0"
          SWARM_BALANCE_B5C_MIXED_CHAIN_RELEASE: "0"
          SWARM_BALANCE_B5B_EXTERNAL_HANDOFF: "0"
          SWARM_BALANCE_B5A_CARGO_CUSTODY_GATE: "0"
          SWARM_BALANCE_INFLIGHT_WIND_REQUOTE: "0"
          SWARM_BALANCE_HELD_ROUTE_REQUOTE: "0"
          SWARM_BALANCE_AUTO_PLANNED_STATION: "0"
          SWARM_BALANCE_CHARGE_TARGET_IDENTITY: "0"
          SWARM_BALANCE_PLANNED_STATION_ROUTE: "0"
          SWARM_BALANCE_STATION_ENERGY_GATE: "0"
        run: |
          .\\.venv310\\Scripts\\python.exe -m unittest discover -s frontend -p test_wind_injection.py -v
