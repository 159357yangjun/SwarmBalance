name: P2.4b-B3a OSM planned-station quote red-green

on:
  push:
    branches: [p2-4b-b3-planned-station-quote-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planned-quote:
    name: Real RoutePlanner and Wh quote
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: RED or GREEN actual A* energy quote and OSM audit
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b3_planned_station_quote
