name: P2.4b-B5e transactional custody RED
on:
  push:
    branches: [p2-4b-b5e-transactional-custody-red-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b5e-transaction:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: B5e crash window RED
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b5e_transactional_custody_red
      - name: Inherited B5d journal and B5c cargo
        run: |
          .\.venv310\Scripts\python.exe -m unittest -v scripts.test_p2_4b_b5d_custody_journal_red scripts.test_p2_4b_b5c_mixed_chain_custody_red scripts.test_p2_4b_b5b_external_custody_red scripts.test_p2_4b_b5a_cargo_custody_red
      - name: Frozen E0 all flags disabled
        env:
          SWARM_BALANCE_B5C_MIXED_CHAIN_RELEASE: "0"
          SWARM_BALANCE_B5B_EXTERNAL_HANDOFF: "0"
          SWARM_BALANCE_B5A_CARGO_CUSTODY_GATE: "0"
          SWARM_BALANCE_INFLIGHT_WIND_REQUOTE: "0"
          SWARM_BALANCE_HELD_ROUTE_REQUOTE: "0"
          SWARM_BALANCE_AUTO_PLANNED_STATION: "0"
          SWARM_BALANCE_CHARGE_TARGET_IDENTITY: "0"
          SWARM_BALANCE_PLANNED_STATION_ROUTE: "0"
          SWARM_BALANCE_STATION_ENERGY_GATE: "0"
        run: |
          .\.venv310\Scripts\python.exe -m unittest discover -s frontend -p test_wind_injection.py -v
