name: P2.3 before-after battery gate replay

on:
  pull_request:
    branches: [ci-validation]

permissions:
  contents: read

concurrency:
  group: p2-3-gate-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  paired:
    if: ${{ github.head_ref == 'p2-3-flight-feasibility-impact-v1' }}
    name: P2.3 real before/after / ${{ matrix.profile }} / shard ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, elevated, high]
        shard: [0, 1]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Strict parse and checkout exact baseline model commits
        run: |
          python -m py_compile scripts/p2_3_feasibility_impact.py
          git worktree add --detach "$env:RUNNER_TEMP/p23-legacy" 806d07653af52b83202ba232cb1f3e88dd9b7901
          git worktree add --detach "$env:RUNNER_TEMP/p23-gate" 5bcc6cb9661dc250c11c578acbacc32c8b0d6f4f
          git -C "$env:RUNNER_TEMP/p23-legacy" rev-parse HEAD
          git -C "$env:RUNNER_TEMP/p23-gate" rev-parse HEAD
      - name: Install unchanged simulator dependencies
        run: |
          python -m venv .venv310
          .\.venv310\Scripts\python.exe -m pip install "pip==23.3.2" numpy==1.26.4
          .\.venv310\Scripts\python.exe -m pip install -r requirements.txt
      - name: Replay five matched tapes against actual pre/post-gate simulator code
        run: |
          .\.venv310\Scripts\python.exe scripts/p2_3_feasibility_impact.py shard --old-root "$env:RUNNER_TEMP/p23-legacy" --new-root "$env:RUNNER_TEMP/p23-gate" --evidence-root "." --outdir "$env:RUNNER_TEMP/p23_results" --profile "${{ matrix.profile }}" --shard ${{ matrix.shard }} --source-sha "$env:EXPERIMENT_SHA"
      - name: Preserve all task tapes, scenario configurations and individual outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p23-paired-${{ matrix.profile }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/p23_results/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    if: ${{ github.head_ref == 'p2-3-flight-feasibility-impact-v1' }}
    name: P2.3 demand-equal 30 paired seeds / 60 simulation episodes
    needs: [paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: p23-paired-*
          merge-multiple: true
          path: ${{ runner.temp }}/p23_results
      - name: Hard fail unless all 30 unique paired seeds, SHA and demand hashes agree
        run: |
          python scripts/p2_3_feasibility_impact.py aggregate --outdir "${{ runner.temp }}/p23_results" --source-sha "$EXPERIMENT_SHA"
      - name: Archive CSV, complete pair JSON, raw seeds and report
        uses: actions/upload-artifact@v4
        with:
          name: p23-full-30pair-before-after-report
          path: ${{ runner.temp }}/p23_results/
          retention-days: 30
          if-no-files-found: error
