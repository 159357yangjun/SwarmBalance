<head data-page-node-id="pKkMcTU9dDvL2vtlXjr0qM">
<meta charset="UTF-8" data-page-node-id="zAgHIL4UZs5G1FXYOIy3IC">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="FizhhgGtTeCt51SxoGnMs3">
<title>无人机调度仿真控制台</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e4e7ec;
    --text: #1f2329; --muted: #86909c; --accent: #2f6fed;
    --idle: #52c41a; --busy: #1890ff; --charging: #faad14; --waiting: #fa8c16;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .topbar .title { font-size: 16px; font-weight: 600; margin-right: 6px; }
  .topbar label { color: var(--muted); font-size: 12px; }
  select, input[type=number] { height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; color: var(--text); }
  .btn { height: 30px; padding: 0 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; color: var(--text); transition: all .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .speed-group { display: flex; }
  .speed-group .btn { border-radius: 0; border-left: none; }
  .speed-group .btn:first-child { border-left: 1px solid var(--border); border-radius: 6px 0 0 6px; }
  .speed-group .btn:last-child { border-radius: 0 6px 6px 0; }
  .speed-group .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg .btn { border: none; border-radius: 0; }
  .seg .btn.active { background: var(--accent); color: #fff; }
  .spacer { flex: 1; }

  .main { flex: 1; display: flex; gap: 12px; padding: 12px 16px; min-height: 0; }
  .canvas-wrap { flex: 1; position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; min-width: 0; }
  #c2d, #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 14px; background: rgba(255,255,255,.9); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; color: var(--muted); z-index: 5; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); background: rgba(255,255,255,.7); z-index: 10; }

  .side { width: 340px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .tabs { display: flex; gap: 6px; }
  .tabs .btn { flex: 1; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 21px; font-weight: 600; margin-top: 3px; }
  .card .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .chart-box .h { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  #trend { width: 100%; height: 160px; }
  #compare { width: 100%; height: 240px; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }

  /* 配置模态 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { width: 560px; max-height: 86vh; overflow: auto; background: #fff; border-radius: 12px; padding: 20px; }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal .group { margin-bottom: 14px; }
  .modal .group-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; border-left: 3px solid var(--accent); padding-left: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select { height: 30px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; font-size: 13px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
</style>
</head>

          <div class="field" data-page-node-id="EVx51Yh4kgKO8XHsloFTOj"><label data-page-node-id="6OvOggCGveUfbalyZFcNju">PSO 迭代次数</label><input type="number" v-model.number="algo.pso_iter" min="5" max="200" data-page-node-id="MRjnpdS0iBNByWwryNoO9F"></div>
          <div class="field" data-page-node-id="bLDu1CM6mEQleZhN9CLM59"><label data-page-node-id="y4qmN0HPnQFucQKvNuamWg">GA 种群规模</label><input type="number" v-model.number="algo.ga_pop" min="10" max="200" data-page-node-id="MAfbCPg4OF6GAu5TAjBa3s"></div>
          <div class="field" data-page-node-id="dtxxmAlOCqQv3HLttMCXw7"><label data-page-node-id="ceBwllcTQVb0aYihs71F5H">GA 进化代数</label><input type="number" v-model.number="algo.ga_gen" min="5" max="200" data-page-node-id="qpROnh9yXzFdd7uqU3rV9N"></div>
          <div class="field" data-page-node-id="CZVyX1fRcmxlBG3FXLM1vc"><label data-page-node-id="BaCHSF1oDPbQvGSd7IZjiV">OR-Tools 求解时限(s)</label><input type="number" v-model.number="algo.ortools_t" min="0.1" max="10" step="0.1" data-page-node-id="SWNdLYdI8D5SCdAA2ChWBX"></div>
          <div class="field" data-page-node-id="enY2NPTDbFm3wPkm8rMON6"><label data-page-node-id="aKm52nvUHFkPaw5iGkYil3">缓冲触发阈值</label><input type="number" v-model.number="algo.buffer" min="5" max="50" data-page-node-id="04w8NvwOsC1AKQReVd94ql"></div>
        </div>
      </div>
      <div class="actions" data-page-node-id="EB56MhHbUDFObRVPnQ0dwP">
        <button class="btn" @click="showConfig=false" data-page-node-id="zjHWTLO2K0EQR4gY5KCvE0">取消</button>
        <button class="btn primary" @click="saveConfig" data-page-node-id="xCZ9sIVEbQh3WgEKNpI2Th">保存并应用</button>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
const STATE_COLOR = { idle: '#52c41a', busy: '#1890ff', charging: '#faad14', waiting_berth: '#fa8c16' };
const PALETTE = ['#1890ff','#fa8c16','#52c41a','#eb2f96','#722ed1','#13c2c2','#f5222d','#a0d911','#2f54eb','#faad14'];

createApp({
  data() {
    return {
      algorithm: 'greedy', seed: 100, playing: false, speed: 1, speeds: [1,2,4,8],
      loading: true, view: '2d', tab: 'metrics', showConfig: false,
      snap: { step:0, time:0, done:false, stats:{ completed:0,generated:0,completion_rate:0,timeout_rate:0,avg_delay:0,energy:0,nest_turnover:0,berth_utilization:0,swap_sessions:0,utilization:0,empty_load_ratio:0,flight_distance:0,chain_insertions:0,no_fly_detours:0 }, drones:[],nests:[],tasks:[],map:{bounds:[0,0,1000,1000]} },
      trajectories: [], trend: [], timer: null, chart: null, compareChart: null,
      compareRows: [], compareColumns: [], compareMetric: '',
      mapStatic: { bounds:[0,0,1000,1000], buildings: [] },
      cfg: { num_drones:10, total_tasks:60, light:5, standard:3, heavy:2, peak:0.7, berths:2, arbitration:'priority', deadline_min:900, episode_max:3600 },
      algo: { pso_particles:20, pso_iter:30, ga_pop:60, ga_gen:40, ortools_t:2.0, buffer:15 },
      three: null, threeState: null,
    };
  },
  computed: {
    baseInterval() { return 400 / this.speed; }
  },
  methods: {
    pct(v) { return (v * 100).toFixed(1) + '%'; },
    async api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) { const e = await r.json().catch(()=>({detail:'请求失败'})); throw new Error(e.detail || r.statusText); }
      return r.json();
    },

    async init() {
      try {
        const snap = await this.api('/api/snapshot');
        this.applySnap(snap);
        this.mapStatic = await this.api('/api/map');
      } finally { this.loading = false; }
      this.initChart();
      window.addEventListener('resize', () => this.onResize());
    },

    applySnap(snap) {
      this.snap = snap;
      snap.drones.forEach(d => {
        if (!this.trajectories[d.idx]) this.trajectories[d.idx] = [];
        this.trajectories[d.idx].push([d.x, d.y]);
      });
      this.trend.push({ step: snap.step, v: snap.stats.completion_rate });
      if (this.trend.length > 200) this.trend.shift();
      this.render();
    },

    render() {
      if (this.view === '2d') this.draw2d(); else this.draw3d();
      this.drawChart();
    },

    async reset() {
      this.stopPlay();
      const snap = await this.api('/api/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({algorithm:this.algorithm, seed:this.seed}) });
      this.trajectories = []; this.trend = [];
      this.applySnap(snap);
    },
    async stepOnce() {
      const snap = await this.api('/api/step', { method:'POST' });
      this.applySnap(snap);
      if (snap.done && this.playing) this.stopPlay();
    },
    togglePlay() { this.playing ? this.stopPlay() : this.startPlay(); },
    startPlay() { this.playing = true; this.timer = setInterval(() => this.stepOnce(), this.baseInterval); },
    stopPlay() { this.playing = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
    setSpeed(s) { this.speed = s; if (this.playing) { this.stopPlay(); this.startPlay(); } },
    onAlgorithmChange() {},
    onResize() { if (this.view === '2d') this.draw2d(); else if (this.threeState) this.resize3d(); this.drawChart(); this.drawCompare(); },

    // ============ 2D ============
    project(bounds, x, y, w, h) {
      const [minx,miny,maxx,maxy] = bounds; const pad = 40;
      const bw = (maxx-minx)||1, bh = (maxy-miny)||1;
      const scale = Math.min((w-pad*2)/bw, (h-pad*2)/bh);
      const ox = (w-bw*scale)/2, oy = (h-bh*scale)/2;
      return { sx: ox+(x-minx)*scale, sy: oy+(maxy-y)*scale, scale };
    },
    draw2d() {
      const cv = document.getElementById('c2d'); if (!cv) return;
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      cv.width = w*dpr; cv.height = h*dpr;
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#fafbfc'; ctx.fillRect(0,0,w,h);
      const b = this.snap.map.bounds;
      const P = (x,y) => this.project(b,x,y,w,h);

      // 禁飞区（红色半透明填充 + 虚线轮廓）
      (this.mapStatic.no_fly_zones || []).forEach(z => {
        ctx.beginPath();
        z.coords.forEach((pt,i) => { const p = P(pt[0],pt[1]); i===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy); });
        ctx.closePath();
        ctx.fillStyle = 'rgba(239,68,68,0.16)'; ctx.fill();
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.4; ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
        const c0 = P(z.coords[0][0], z.coords[0][1]);
        ctx.fillStyle = '#b91c1c'; ctx.font = '10px sans-serif';
        ctx.fillText(z.name || '禁飞区', c0.sx + 4, c0.sy - 4);
      });

      ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      this.snap.tasks.forEach(t => {
        const a = P(t.source[0],t.source[1]), d = P(t.destination[0],t.destination[1]);
        ctx.strokeStyle = '#d0d5dd'; ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(d.sx,d.sy); ctx.stroke();
      });
      ctx.setLineDash([]);

      this.snap.nests.forEach(n => {
        const p = P(n.x,n.y);
        ctx.fillStyle = '#faad14'; ctx.beginPath();
        ctx.moveTo(p.sx,p.sy-7); ctx.lineTo(p.sx+6,p.sy+5); ctx.lineTo(p.sx-6,p.sy+5); ctx.closePath(); ctx.fill();
      });

      this.trajectories.forEach((tr,idx) => {
        if (!tr || tr.length < 2) return;
        ctx.strokeStyle = PALETTE[idx % PALETTE.length]; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.2;
        ctx.beginPath();
        tr.forEach(([x,y],k) => { const p=P(x,y); k===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy); });
        ctx.stroke(); ctx.globalAlpha = 1;
      });

      this.snap.tasks.forEach(t => {
        const a = P(t.source[0],t.source[1]), d = P(t.destination[0],t.destination[1]);
        ctx.fillStyle = '#8a919f'; ctx.beginPath(); ctx.arc(a.sx,a.sy,2.5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#4b5563'; ctx.beginPath(); ctx.arc(d.sx,d.sy,2.5,0,Math.PI*2); ctx.fill();
      });

      this.snap.drones.forEach(d => {
        const p = P(d.x,d.y);
        ctx.fillStyle = STATE_COLOR[d.state] || '#888'; ctx.beginPath(); ctx.arc(p.sx,p.sy,5,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      });
    },

    // ============ 3D ============
    switchView(v) {
      this.view = v;
      this.$nextTick(() => { if (v === '3d' && !this.threeState) this.init3d(); this.render(); });
    },
    center3d() {
      const b = this.mapStatic.bounds; return { x:(b[0]+b[2])/2, y:(b[1]+b[3])/2 };
    },
    init3d() {
      const el = document.getElementById('c3d'); if (!el || !window.THREE) return;
      const THREE = window.THREE;
      const st = { center: this.center3d(), theta: 0.7, phi: 1.05, radius: 4000, mouse:{down:false,x:0,y:0} };
      this.threeState = st;

      const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf0f2f5);
      const camera = new THREE.PerspectiveCamera(55, el.clientWidth/el.clientHeight, 1, 200000);
      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setPixelRatio(window.devicePixelRatio||1);
      renderer.setSize(el.clientWidth, el.clientHeight);
      el.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.65));
      const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(3000,5000,2000); scene.add(dir);

      // 地面
      const b = this.mapStatic.bounds;
      const gw = (b[2]-b[0])*1.3, gh = (b[3]-b[1])*1.3;
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(gw, gh),
        new THREE.MeshLambertMaterial({ color: 0xe8ebef }));
      ground.rotation.x = -Math.PI/2; ground.position.y = -1; scene.add(ground);

      // 建筑
      const c = st.center;
      const bmat = new THREE.MeshLambertMaterial({ color: 0xb9c4d0 });
      this.mapStatic.buildings.forEach(bd => {
        const shape = new THREE.Shape();
        bd.coords.forEach((pt,i) => { const x=pt[0]-c.x, y=pt[1]-c.y; i===0?shape.moveTo(x,y):shape.lineTo(x,y); });
        const geo = new THREE.ExtrudeGeometry(shape, { depth: bd.height, bevelEnabled:false });
        const mesh = new THREE.Mesh(geo, bmat);
        mesh.rotation.x = -Math.PI/2;
        scene.add(mesh);
      });

      // 禁飞区（红色半透明棱柱；y 取负与建筑旋转后坐标一致）
      (this.mapStatic.no_fly_zones || []).forEach(z => {
        const shape = new THREE.Shape();
        z.coords.forEach((pt,i) => { const x=pt[0]-c.x, y=pt[1]-c.y; i===0?shape.moveTo(x,y):shape.lineTo(x,y); });
        const geo = new THREE.ExtrudeGeometry(shape, { depth: 180, bevelEnabled:false });
        const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
          color: 0xef4444, transparent: true, opacity: 0.28 }));
        mesh.rotation.x = -Math.PI/2;
        scene.add(mesh);
      });

      // 机巢（平面 y 取负：与建筑旋转后坐标一致，避免南北镜像错位）
      const nmat = new THREE.MeshLambertMaterial({ color: 0xfaad14 });
      this.snap.nests.forEach(n => {
        const cone = new THREE.Mesh(new THREE.ConeGeometry(14, 40, 6), nmat);
        cone.position.set(n.x-c.x, 20, -(n.y-c.y)); scene.add(cone);
      });

      // 无人机占位（每组一个 mesh，运行时更新位置）
      const dmesh = [];
      const dgeo = new THREE.SphereGeometry(10, 16, 16);
      this.snap.drones.forEach((d,i) => {
        const m = new THREE.Mesh(dgeo, new THREE.MeshLambertMaterial({ color: STATE_COLOR[d.state]||'#888' }));
        m.position.set(d.x-c.x, 35, -(d.y-c.y)); scene.add(m); dmesh.push(m);
      });

      // 无人机历史轨迹线（每架机一条，运行时刷新顶点）
      const trailLines = this.snap.drones.map((d,i) => {
        const line = new THREE.Line(
          new THREE.BufferGeometry(),
          new THREE.LineBasicMaterial({ color: PALETTE[i % PALETTE.length], transparent: true, opacity: 0.45 }));
        line.visible = false; scene.add(line); return line;
      });

      // 任务起终点（共享材质，运行时重建几何）
      const taskGroup = new THREE.Group(); scene.add(taskGroup);
      const taskMat = {
        line: new THREE.LineBasicMaterial({ color: 0x99a0ab, transparent: true, opacity: 0.5 }),
        src: new THREE.MeshBasicMaterial({ color: 0x52c41a }),
        dst: new THREE.MeshBasicMaterial({ color: 0xf5222d }),
      };
      const taskDotGeo = new THREE.SphereGeometry(8, 8, 8);

      st.scene = scene; st.camera = camera; st.renderer = renderer; st.dmesh = dmesh;
      st.trailLines = trailLines; st.taskGroup = taskGroup; st.taskMat = taskMat; st.taskDotGeo = taskDotGeo;
      st.updateCamera = () => {
        const t = st.theta, p = st.phi, r = st.radius;
        camera.position.set(
          Math.sin(t)*Math.cos(p)*r,
          Math.sin(p)*r,
          Math.cos(t)*Math.cos(p)*r);
        camera.lookAt(0, 0, 0);
      };
      st.updateCamera();

      el.addEventListener('mousedown', e => { st.mouse.down = true; st.mouse.x = e.clientX; st.mouse.y = e.clientY; });
      window.addEventListener('mousemove', e => {
        if (!st.mouse.down) return;
        const dx = e.clientX - st.mouse.x, dy = e.clientY - st.mouse.y;
        st.theta -= dx*0.005; st.phi += dy*0.005;
        st.phi = Math.max(0.2, Math.min(1.4, st.phi));
        st.mouse.x = e.clientX; st.mouse.y = e.clientY; st.updateCamera();
      });
      window.addEventListener('mouseup', () => { st.mouse.down = false; });
      el.addEventListener('wheel', e => {
        e.preventDefault();
        st.radius = Math.max(1200, Math.min(20000, st.radius * (1 + e.deltaY*0.001)));
        st.updateCamera();
      }, { passive:false });

      const loop = () => { if (this.view==='3d' && this.threeState) { st.renderer.render(st.scene, st.camera); } requestAnimationFrame(loop); };
      loop();
    },
    resize3d() {
      const el = document.getElementById('c3d'), st = this.threeState;
      if (!el || !st) return;
      st.renderer.setSize(el.clientWidth, el.clientHeight);
      st.camera.aspect = el.clientWidth/el.clientHeight; st.camera.updateProjectionMatrix();
    },
    draw3d() {
      const st = this.threeState; if (!st) return;
      const c = st.center;
      this.snap.drones.forEach((d,i) => {
        const m = st.dmesh[i]; if (!m) return;
        const alt = (d.state === 'busy') ? 45 : 5;
        m.position.set(d.x-c.x, alt, -(d.y-c.y));
        m.material.color.set(STATE_COLOR[d.state] || '#888');
      });

      // 轨迹线
      this.trajectories.forEach((tr, i) => {
        const line = st.trailLines[i]; if (!line) return;
        if (!tr || tr.length < 2) { line.visible = false; return; }
        line.visible = true;
        const pts = tr.map(([x,y]) => new THREE.Vector3(x-c.x, 14, -(y-c.y)));
        const g = new THREE.BufferGeometry().setFromPoints(pts);
        if (line.geometry) line.geometry.dispose();
        line.geometry = g;
      });

      // 任务起终点（共享材质，重建几何）
      const tg = st.taskGroup;
      tg.children.forEach(child => { if (child.geometry) child.geometry.dispose(); });
      tg.clear();
      this.snap.tasks.forEach(t => {
        const a = new THREE.Vector3(t.source[0]-c.x, 6, -(t.source[1]-c.y));
        const d = new THREE.Vector3(t.destination[0]-c.x, 6, -(t.destination[1]-c.y));
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,d]), st.taskMat.line);
        tg.add(line);
        const s = new THREE.Mesh(st.taskDotGeo, st.taskMat.src); s.position.copy(a); tg.add(s);
        const dd = new THREE.Mesh(st.taskDotGeo, st.taskMat.dst); dd.position.copy(d); tg.add(dd);
      });
    },

    // ============ 配置 ============
    async openConfig() {
      try {
        const cfg = await this.api('/api/config');
        const algo = await this.api('/api/scheduler-config');
        this.cfg.num_drones = cfg.environment?.num_drones ?? 10;
        this.cfg.total_tasks = cfg.task_generation?.realistic?.total_tasks ?? 60;
        this.cfg.light = cfg.heterogeneous?.fleet_mix?.light_express ?? 0;
        this.cfg.standard = cfg.heterogeneous?.fleet_mix?.standard_cargo ?? 0;
        this.cfg.heavy = cfg.heterogeneous?.fleet_mix?.heavy_cargo ?? 0;
        this.cfg.peak = cfg.task_generation?.realistic?.peak_probability ?? 0.7;
        this.cfg.berths = cfg.nest?.berths ?? 2;
        this.cfg.arbitration = cfg.nest?.arbitration_policy ?? 'priority';
        this.cfg.deadline_min = cfg.task?.deadline_offset_min ?? 900;
        this.cfg.episode_max = cfg.environment?.episode_max_steps ?? 3600;
        this.algo.pso_particles = algo.pso?.num_particles ?? 20;
        this.algo.pso_iter = algo.pso?.max_iterations ?? 30;
        this.algo.ga_pop = algo.ga?.population_size ?? 60;
        this.algo.ga_gen = algo.ga?.generations ?? 40;
        this.algo.ortools_t = algo.ortools?.time_limit_seconds ?? 2.0;
        this.algo.buffer = algo.dual_channel?.buffer_size_threshold ?? 15;
      } catch(e) { console.warn(e); }
      this.showConfig = true;
    },
    async saveConfig() {
      const scenePatch = {
        environment: { num_drones: this.cfg.num_drones, episode_max_steps: this.cfg.episode_max },
        heterogeneous: { fleet_mix: { light_express: this.cfg.light, standard_cargo: this.cfg.standard, heavy_cargo: this.cfg.heavy } },
        task_generation: { realistic: { total_tasks: this.cfg.total_tasks, peak_probability: this.cfg.peak } },
        task: { deadline_offset_min: this.cfg.deadline_min },
        nest: { berths: this.cfg.berths, arbitration_policy: this.cfg.arbitration },
      };
      const algoPatch = {
        pso: { num_particles: this.algo.pso_particles, max_iterations: this.algo.pso_iter },
        ga: { population_size: this.algo.ga_pop, generations: this.algo.ga_gen },
        ortools: { time_limit_seconds: this.algo.ortools_t },
        dual_channel: { buffer_size_threshold: this.algo.buffer },
      };
      this.showConfig = false;
      await this.api('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({patch: scenePatch}) });
      await this.api('/api/scheduler-config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({patch: algoPatch}) });
      const snap = await this.api('/api/rebuild', { method:'POST' });
      this.trajectories = []; this.trend = [];
      this.mapStatic = await this.api('/api/map');
      this.applySnap(snap);
    },

    // ============ 对比看板 ============
    async switchTabCompare() {
      this.tab = 'compare';
      if (!this.compareRows.length) await this.loadCompare();
      this.$nextTick(() => this.drawCompare());
    },
    async loadCompare() {
      const d = await this.api('/api/compare');
      this.compareRows = d.rows; this.compareColumns = d.columns;
      if (!this.compareMetric || !d.columns.includes(this.compareMetric)) this.compareMetric = d.columns[0] || '';
      this.$nextTick(() => this.drawCompare());
    },
    drawCompare() {
      if (this.tab !== 'compare') return;
      if (!this.compareChart) { const el = document.getElementById('compare'); if (el) this.compareChart = echarts.init(el); }
      if (!this.compareChart) return;
      const m = this.compareMetric; if (!m) return;
      const algos = this.compareRows.map(r => r['算法']);
      const vals = this.compareRows.map(r => r[m] ?? 0);
      this.compareChart.setOption({
        grid: { left: 40, right: 12, top: 20, bottom: 30 },
        xAxis: { type:'category', data: algos, axisLabel:{fontSize:10, rotate:20} },
        yAxis: { type:'value', axisLabel:{fontSize:10} },
        tooltip: { trigger:'axis' },
        series: [{ type:'bar', data: vals, itemStyle:{ color:'#2f6fed' }, barMaxWidth: 40 }]
      });
    },

    // ============ 趋势图 ============
    initChart() {
      const el = document.getElementById('trend'); if (el) this.chart = echarts.init(el);
      this.drawChart();
    },
    drawChart() {
      if (!this.chart) return;
      this.chart.setOption({
        grid: { left: 36, right: 12, top: 12, bottom: 24 },
        xAxis: { type:'value', name:'步', nameTextStyle:{fontSize:10}, axisLabel:{fontSize:10} },
        yAxis: { type:'value', min:0, max:1, axisLabel:{fontSize:10, formatter:v=>(v*100)+'%'} },
        series: [{ type:'line', data: this.trend.map(p=>[p.step,p.v]), showSymbol:false, smooth:true, lineStyle:{width:2,color:'#2f6fed'}, areaStyle:{color:'rgba(47,111,237,0.12)'} }]
      });
    }
  },
  mounted() { this.init(); },
  beforeUnmount() { this.stopPlay(); if (this.chart) this.chart.dispose(); if (this.compareChart) this.compareChart.dispose(); }
}).mount('#app');
</script>
